name: Deploy to GitHub Pages

# Release-gated: a push to `main` does NOT deploy. The live site only
# updates when a GitHub Release is published (operator runs
# `gh release create vX.Y.Z` after `/release-readiness`), or when this
# workflow is manually dispatched. This decouples "merge work to main"
# from "publish to production" — main can accumulate unreleased changes
# without changing the live site. CI (`ci.yml`) still build-checks every
# PR, so breakage is caught before merge, not at release time.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Zola
        uses: taiki-e/install-action@7be9fd86bd1707236395105d6e9329dd1511a7e1 # v2.79.0
        with:
          tool: zola@0.19.2

      - name: Build
        run: zola build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
