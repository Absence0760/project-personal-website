name: CI

# PR-only build check. Runs `zola build` against the PR head to catch broken
# templates, dead internal links, or invalid front-matter before merge. Deploy
# is release-gated (`deploy.yml` fires on a published Release, not on push to
# main), so this PR check is the build signal that gates merges into main —
# breakage is caught here, well before a release is cut (especially dependabot's
# action bumps — auto-merge waits on this job before landing them).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Supersede in-flight runs when a new commit lands on the same PR ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Zola
        uses: taiki-e/install-action@7be9fd86bd1707236395105d6e9329dd1511a7e1 # v2.79.0
        with:
          # Pinned to match deploy.yml — keeping the build version in lockstep
          # avoids the PR going green on a different Zola than the one that
          # will eventually deploy.
          tool: zola@0.19.2

      - name: Build site
        # `--drafts` is intentionally not set — drafts shouldn't gate CI.
        run: zola build

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs: [build]
    steps:
      - name: Require every upstream job to have passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          bad=$(echo "$NEEDS_JSON" | jq -r \
            'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::CI gate failing — upstream jobs did not pass:"
            echo "$bad"
            exit 1
          fi
          echo "All upstream jobs passed."
