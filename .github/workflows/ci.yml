name: CI

# PR-only build check. Installs deps and runs the SvelteKit build + checks
# against the PR head to catch type errors, broken components, or a failing
# build before merge. Deploy is release-gated (`deploy.yml` fires on a
# published Release, not on push to main), so this PR check is the build signal
# that gates merges into main — breakage is caught here, well before a release
# is cut (especially dependabot's bumps — auto-merge waits on this job before
# landing them).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Supersede in-flight runs when a new commit lands on the same PR ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        # Version comes from the `packageManager` field in package.json.
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (types + svelte-check + script guard)
        run: |
          pnpm run check
          pnpm run test:scripts

      - name: Test
        run: pnpm test

      - name: Build site
        run: pnpm build

      # Same PDF step deploy.yml runs at release time — catch breakage
      # (print CSS, Playwright bump, script error) at PR time instead.
      - name: Install Playwright Chromium (for the CV PDF)
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate cv.pdf from the built /cv/ page
        run: pnpm build:pdf

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs: [build]
    steps:
      - name: Require every upstream job to have passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          bad=$(echo "$NEEDS_JSON" | jq -r \
            'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::CI gate failing — upstream jobs did not pass:"
            echo "$bad"
            exit 1
          fi
          echo "All upstream jobs passed."
