name: CI

# PR-only build check. Installs deps and runs the SvelteKit build + checks
# against the PR head to catch type errors, broken components, a failing build,
# or a browser-level regression (the Playwright suite in ./e2e) before merge. Deploy is release-gated (`deploy.yml` fires on a
# published Release, not on push to main), so this PR check is the build signal
# that gates merges into main — breakage is caught here, well before a release
# is cut (especially dependabot's bumps — auto-merge waits on this job before
# landing them).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Supersede in-flight runs when a new commit lands on the same PR ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        # Version comes from the `packageManager` field in package.json.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (types + svelte-check + script guard)
        run: |
          pnpm run check
          pnpm run test:scripts

      - name: Test
        run: pnpm test

      - name: Build site
        run: pnpm build

      # Same PDF step deploy.yml runs at release time — catch breakage
      # (print CSS, Playwright bump, script error) at PR time instead.
      - name: Install Playwright Chromium (for the CV PDF)
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate cv.pdf from the built /cv/ page
        run: pnpm build:pdf

      # Browser-level regression suite. It runs here rather than as its own job
      # because everything it needs is already on this runner — Chromium from
      # the step above, and ./build from the build step — so a separate job
      # would pay the install cost twice for a ~90s suite.
      #
      # It covers what `check`, `test` and `build` structurally cannot: those
      # three type-check, run Vitest in a *node* environment with no DOM, and
      # prove the site compiles. A page that renders perfectly and then fights
      # the reader's scroll passes all three, which is exactly what shipped.
      - name: End-to-end regression suite (Playwright)
        run: pnpm test:e2e

      # Traces for the failing tests only; nothing is uploaded on a green run.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs: [build]
    steps:
      - name: Require every upstream job to have passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          bad=$(echo "$NEEDS_JSON" | jq -r \
            'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::CI gate failing — upstream jobs did not pass:"
            echo "$bad"
            exit 1
          fi
          echo "All upstream jobs passed."
