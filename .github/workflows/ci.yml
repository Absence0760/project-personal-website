name: CI

# PR-only build check. Runs `zola build` against the PR head to catch broken
# templates, dead internal links, or invalid front-matter before merge. Deploy
# is release-gated (`deploy.yml` fires on a published Release, not on push to
# main), so this PR check is the build signal that gates merges into main —
# breakage is caught here, well before a release is cut (especially dependabot's
# action bumps — auto-merge waits on this job before landing them).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Supersede in-flight runs when a new commit lands on the same PR ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Zola
        uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2.82.9
        with:
          # Pinned to match deploy.yml — keeping the build version in lockstep
          # avoids the PR going green on a different Zola than the one that
          # will eventually deploy.
          tool: zola@0.19.2

      - name: Build site
        # `--drafts` is intentionally not set — drafts shouldn't gate CI.
        run: zola build
