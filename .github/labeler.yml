# Config for actions/labeler. Each top-level key is a label name; the
# `changed-files` list is the set of glob patterns that, if matched by any
# changed file, applies the label.
#
# These globs reflect this repo's actual layout — a SvelteKit static site
# (single flat package, no `frontend/` / `backend/` / `infra/` split).

"area:content":
  - changed-files:
      - any-glob-to-any-file:
          - src/routes/**

"area:legal":
  - changed-files:
      - any-glob-to-any-file:
          - src/routes/terms/**
          - src/routes/privacy/**
          - src/routes/refunds/**
          - src/routes/contact/**
          - docs/legal-status.md

"area:app":
  - changed-files:
      - any-glob-to-any-file:
          - src/**
          - svelte.config.js
          - vite.config.ts
          - vitest.config.ts
          - tsconfig.json
          - package.json

"area:static":
  - changed-files:
      - any-glob-to-any-file:
          - static/**

"area:ci":
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .github/dependabot.yml
          - .pre-commit-config.yaml

"area:docs":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - docs/**
          - CLAUDE.md

"area:claude":
  - changed-files:
      - any-glob-to-any-file:
          - .claude/**

"area:deps":
  - changed-files:
      - any-glob-to-any-file:
          - .github/dependabot.yml
          - .github/workflows/**
