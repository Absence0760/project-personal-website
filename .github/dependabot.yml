# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# This is a SvelteKit static site. Two dependency surfaces to track: the npm
# packages that build the site (SvelteKit / Vite / Svelte toolchain, all
# devDependencies) and the GitHub Actions referenced in `.github/workflows/`.
# Keeping both current closes the most common supply-chain gaps on a small repo.
#
# Bumps are auto-merged for minor/patch via dependabot-auto-merge.yml; major
# bumps stay manual.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # TypeScript is held on 5.x. svelte-check 4.x refuses TS 7 outright
    # ("TypeScript 7 support currently requires both TypeScript 7 and
    # TypeScript 6 installed in your project, and requires using the --tsgo
    # flag"), so a grouped major sweep takes `pnpm check` — and with it the
    # required `CI gate` — down. Lift this once svelte-check supports TS 7.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      svelte-toolchain:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      all-actions:
        patterns:
          - "*"
