<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Page not found | Jared Howard</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #fafaf8;
				--text: #1a1a1a;
				--muted: #6b6b6b;
				--accent: #2563eb;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #1a1b26;
					--text: #a9b1d6;
					--muted: #565f89;
					--accent: #7aa2f7;
				}
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 0.75rem;
				padding: 2rem;
				font-family: "Inter", system-ui, -apple-system, sans-serif;
				background: var(--bg);
				color: var(--text);
				text-align: center;
			}
			h1 {
				font-size: 2rem;
				margin: 0;
			}
			p {
				color: var(--muted);
				margin: 0;
			}
			a {
				color: var(--accent);
				text-decoration: none;
			}
			a:hover {
				text-decoration: underline;
			}
		</style>
	</head>
	<body>
		<h1>404 — Page not found</h1>
		<p>That page doesn't exist.</p>
		<p><a href="/">Return to the home page</a> or <a href="/contact/">get in touch</a>.</p>
	</body>
</html>
