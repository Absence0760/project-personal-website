<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
		<noscript>
			<!-- Without JS the carousel can't rotate, so show every project card as
			     a stacked grid. Overrides the default single-slide layout in app.css. -->
			<style>
				.carousel {
					overflow: visible;
				}
				.carousel-track {
					display: grid;
					grid-template-columns: 1fr;
					gap: 1.25rem;
				}
			</style>
		</noscript>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
