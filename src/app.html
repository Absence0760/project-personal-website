<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<!-- Matches the page ground in each scheme, so the mobile browser chrome
		     blends instead of announcing itself in brand blue. -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7fa" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16161e" />
		<!-- First-party, inline, blocking and sub-millisecond: it must land before
		     first paint so the landing page's scroll-reveal can start hidden with
		     no flash. Without JS the class never lands, `[data-reveal]` is never
		     hidden, and the fully-composed page renders as prerendered. -->
		<script>document.documentElement.classList.add('js')</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
