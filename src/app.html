<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<!-- Matches the page ground in each scheme, so the mobile browser chrome
		     blends instead of announcing itself in brand blue. -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eff3fa" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070b18" />
		<!-- First-party, inline, blocking and sub-millisecond: it must land before
		     first paint so the landing page's scroll-reveal can start hidden with
		     no flash. Without JS the class never lands, `[data-reveal]` is never
		     hidden, and the fully-composed page renders as prerendered. -->
		<script>
			var root = document.documentElement;
			root.classList.add('js');
			// `.js [data-reveal] { opacity: 0 }` is armed here but only ever cleared
			// by `use:reveal` after hydration. If the module bundle never runs — a
			// dropped hashed chunk, a script-blocking extension or proxy, a parse
			// error — the prerendered content is in the DOM but invisible forever.
			// The layout sets `data-hydrated` on mount; if that hasn't happened,
			// disarm so the page falls back to the fully-composed no-JS rendering.
			setTimeout(function () {
				if (!root.hasAttribute('data-hydrated')) root.classList.remove('js');
			}, 2000);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
